name: Auto Release

# On a successful CI run for a push to master (i.e. a merged PR), tag the version
# in the VERSION file, push that tag, and dispatch release.yml.
#
# This does NOT bump the version — the version is set deliberately in the PR via
# versionator, and ci.yml's version-guard ensures it is fresh. If the tag
# already exists this job FAILS rather than silently skipping.
#
# A tag pushed with the default GITHUB_TOKEN does NOT start other workflows, so
# release.yml would never fire off the tag alone. Rather than require a PAT,
# this job dispatches release.yml explicitly after tagging — the same approach
# build.yml used when this repository last auto-released.

on:
  workflow_run:
    workflows: ["CI"]
    types:
      - completed
    branches: [master]

permissions:
  contents: write # push the tag
  actions: write # dispatch release.yml

jobs:
  tag-release:
    name: Tag VERSION and trigger release
    runs-on: ubuntu-latest
    if: >
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push'

    steps:
      - name: Checkout master
        uses: actions/checkout@v4
        with:
          ref: master
          fetch-depth: 0

      - name: Configure git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Tag VERSION (fail if it already exists)
        id: tag
        run: |
          V="$(tr -d '[:space:]' < VERSION)"
          if [ -z "$V" ]; then
            echo "::error::VERSION file is empty"; exit 1
          fi
          TAG="v${V#v}"
          if git rev-parse -q --verify "refs/tags/$TAG" >/dev/null; then
            echo "::error::Tag $TAG already exists. VERSION must be bumped per release; refusing to re-tag."
            exit 1
          fi
          git tag "$TAG"
          git push origin "$TAG"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "Tagged and pushed $TAG."

      - name: Trigger release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.tag.outputs.tag }}
        run: |
          gh workflow run release.yml -f tag="$TAG"
          echo "::notice::Dispatched release.yml for $TAG"
