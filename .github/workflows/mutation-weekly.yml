name: Weekly Mutation

# Whole-codebase mutation testing on a schedule. Per-PR/push CI runs the fast
# diff-only mutation (see ci.yml); this catches efficacy regressions across the
# entire tree that a diff can't see. It gates nothing — a failure surfaces in the
# Actions tab, and GitHub emails the repo admins when a scheduled run fails.
on:
  schedule:
    - cron: "0 6 * * 1" # Mondays 06:00 UTC
  workflow_dispatch:

permissions:
  contents: read

jobs:
  full-mutation:
    name: Full Mutation Testing
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Install gremlins
        run: go install github.com/go-gremlins/gremlins/cmd/gremlins@v0.5.0

      - name: Run full mutation tests
        run: gremlins unleash
