name: Release

# Single release pipeline, triggered when auto-release.yml pushes a v* tag on a
# merge to main. It merges the two former release flows:
#
#   - GoReleaser owns the binaries, archives, checksums, changelog, the GitHub
#     Release, and the Homebrew cask (benjaminabbitt/homebrew-tap).
#   - A second job preserves what the old hand-rolled release.yml uniquely did:
#     publish the multi-arch container images to ghcr.io, and (best-effort)
#     append VirusTotal scan links to the GoReleaser-created release notes.
#
# This avoids the previous conflict where two workflows each tried to create the
# same GitHub Release.

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write # create the GitHub Release / edit its notes
  packages: write # push container images to ghcr.io

jobs:
  goreleaser:
    name: Binaries, Release & Homebrew (GoReleaser)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # full history + tags so the changelog has commits
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - uses: goreleaser/goreleaser-action@v6
        with:
          version: "~> v2"
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # PAT with contents:write on benjaminabbitt/homebrew-tap (cross-repo
          # cask push; the default token can't reach another repository).
          HOMEBREW_TAP_GITHUB_TOKEN: ${{ secrets.HOMEBREW_TAP_GITHUB_TOKEN }}

  containers:
    name: Container images (ghcr.io) + VirusTotal
    needs: goreleaser # the Release must exist before we append VT notes to it
    runs-on: ubuntu-latest
    permissions:
      contents: write # append the VirusTotal section to the release notes
      packages: write # push images to ghcr.io
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - uses: extractions/setup-just@v2

      - name: Extract tag/version
        id: tag_version
        run: |
          TAG=${GITHUB_REF#refs/tags/}
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "version=${TAG#v}" >> "$GITHUB_OUTPUT"

      - name: Build all-platform static binaries
        run: just build-all

      - name: Package archives (for scanning)
        run: |
          mkdir -p release
          for b in linux-amd64 linux-arm64 darwin-amd64 darwin-arm64 freebsd-amd64; do
            chmod +x "bin/versionator-$b"
            tar -czf "release/versionator-$b.tar.gz" -C bin "versionator-$b"
          done
          for b in windows-amd64 windows-arm64; do
            (cd bin && zip "../release/versionator-$b.zip" "versionator-$b.exe")
          done

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Prepare container context
        run: |
          mkdir -p container-context
          cp bin/versionator-linux-amd64 bin/versionator-linux-arm64 container-context/
          cp Containerfile container-context/

      - name: Build & push container images
        uses: docker/build-push-action@v5
        with:
          context: container-context
          file: container-context/Containerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ghcr.io/${{ github.repository }}:${{ steps.tag_version.outputs.tag }}
            ghcr.io/${{ github.repository }}:${{ steps.tag_version.outputs.version }}
            ghcr.io/${{ github.repository }}:latest

      - name: VirusTotal scan and append to release notes (best-effort)
        continue-on-error: true
        env:
          VIRUSTOTAL_API_KEY: ${{ secrets.VIRUSTOTAL_API_KEY }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ steps.tag_version.outputs.tag }}
        run: |
          if [ -z "$VIRUSTOTAL_API_KEY" ]; then
            echo "VIRUSTOTAL_API_KEY not set; skipping VirusTotal."; exit 0
          fi
          {
            echo "### Security Scanning"
            echo ""
            echo "> ⚠️ A clean scan does not guarantee safety, and false positives occur. Build from source if you have concerns."
            echo ""
            echo "| Archive | VirusTotal Analysis |"
            echo "|---------|---------------------|"
          } > vt.md
          for archive in release/*.tar.gz release/*.zip; do
            name=$(basename "$archive")
            resp=$(curl -s --request POST --url 'https://www.virustotal.com/api/v3/files' \
              --header "x-apikey: $VIRUSTOTAL_API_KEY" --form "file=@$archive")
            id=$(echo "$resp" | jq -r '.data.id // empty')
            if [ -n "$id" ]; then
              echo "| \`$name\` | [View Analysis](https://www.virustotal.com/gui/file-analysis/$id) |" >> vt.md
            else
              echo "| \`$name\` | Upload failed |" >> vt.md
            fi
            sleep 16 # free-tier rate limit: 4 req/min
          done
          body=$(gh release view "$TAG" --json body -q .body)
          printf '%s\n\n%s\n' "$body" "$(cat vt.md)" | gh release edit "$TAG" --notes-file -
